name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      # Both bootstrap zips are gitignored (~32MB each); the downloadBootstrap
      # task fetches them from GitHub releases with a pinned SHA-256, so the
      # cache only saves bandwidth, not integrity checking.
      - name: Cache bootstrap assets
        uses: actions/cache@v4
        with:
          path: bootstrap-cache/*.zip
          key: bootstrap-${{ hashFiles('app/build.gradle.kts') }}

      - name: Build debug APK and lint
        run: ./gradlew assembleDebug lintDebug --stacktrace

      - name: Build unsigned release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          # No signing credentials on CI: the release is built unsigned.
          AMCODE_STORE_FILE: ''

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: amcode-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: amcode-release-unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
